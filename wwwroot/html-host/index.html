<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hosted HTML</title>
    <style>
        :root {
            --bg: #eef4ff;
            --panel: #ffffff;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --text: #0f172a;
            --muted: #475569;
            --shadow: rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #eff6ff, #e0e7ff);
            font-family: Arial, sans-serif;
            color: var(--text);
        }

        .card {
            width: min(640px, 90vw);
            background: var(--panel);
            border-radius: 24px;
            box-shadow: 0 20px 45px var(--shadow);
            padding: 2rem;
        }

        .badge {
            display: inline-block;
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary-dark);
            border-radius: 999px;
            padding: 0.4rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 1rem 0 0.5rem;
            font-size: clamp(2rem, 4vw, 3rem);
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 0.85rem 1.3rem;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }

        .primary {
            background: var(--primary);
            color: white;
        }

        .secondary {
            background: #e2e8f0;
            color: var(--text);
        }
    </style>
</head>
<body>
    <main class="card">
        <span class="badge">Embedded</span>
        <h1>HTML Preview</h1>
        <p>
            This content is rendered inside an iframe hosted by the Blazor app. You can replace it with any HTML page,
            dashboard, or mock UI you want to preview in the app.
        </p>
        <div class="actions">
            <button class="primary" type="button">Launch</button>
            <button class="secondary" type="button">View source</button>
        </div>
    </main>
</body>
</html>
