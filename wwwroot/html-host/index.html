<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网页预览</title>
    <style>
        :root {
            --panel: #fff;
            --primary: #7356d8;
            --primary-dark: #6045bd;
            --text: #28272b;
            --muted: #77757b;
            --shadow: rgba(31, 29, 35, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f7f7f6;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
        }

        .card {
            width: min(640px, 90vw);
            background: #fff;
            border: 1px solid #e7e6e4;
            border-radius: 20px;
            box-shadow: 0 20px 45px var(--shadow);
            padding: 2rem;
        }

        .badge {
            display: inline-block;
            background: #f0ebff;
            color: var(--primary-dark);
            border-radius: 999px;
            padding: 0.4rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 1rem 0 0.5rem;
            font-size: clamp(2rem, 4vw, 3rem);
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        button {
            border: 1px solid #e8e7e5;
            border-radius: 999px;
            padding: 0.48rem 0.9rem;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            color: var(--text);
            background: #fff;
            transition: border-color 150ms ease, background 150ms ease, color 150ms ease;
        }

        button:hover {
            border-color: #c8baf4;
            background: #f4f0ff;
            color: #49358c;
        }

        .primary {
            background: #fff;
            color: var(--text);
        }

        .secondary {
            background: #fff;
            color: var(--text);
        }
    </style>
</head>
<body>
    <main class="card">
        <span class="badge">网页生成器</span>
        <h1>网页预览</h1>
        <p>
            这里会显示生成的网页预览。你可以创建网页、仪表盘或界面原型，并在此查看效果。
        </p>
        <div class="actions">
            <button class="primary" type="button">开始创作</button>
            <button class="secondary" type="button">查看代码</button>
        </div>
    </main>
</body>
</html>
